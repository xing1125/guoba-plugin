<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!--
    YingPanel（荧后台）徽标 · 元素提炼版

    设计来源：主人提供的参考图（荧 校服立绘）。只提炼视觉符号，不复制人物形象：
      · 发间五瓣白花  → 徽标主体（花瓣层叠、花心留白）
      · 领口星形胸针  → 花心金星的来源，也是"荧=星火"的语义
      · 水手服的天空蓝 + 金发暖金 → 主色 / 点色
      · 背景气泡与云 → 底板上的气泡纹，保留原图的水感与通透

    造型约束（32px 可读）：
      · 五瓣花外接半径 132 / 512 = 26%，缩到 32px 花径仍有 16.5px，花瓣间隙不会糊死
      · 金星外接半径 60 → 32px 下 3.75px，靠暖金与白花瓣的强对比撑住
      · 花瓣之间留 10° 缝隙，避免小尺寸粘成一团白饼
  -->
  <defs>
    <linearGradient id="sky" x1=".15" y1="0" x2=".85" y2="1">
      <stop offset="0" stop-color="#8ec7f3" />
      <stop offset=".52" stop-color="#5f9de0" />
      <stop offset="1" stop-color="#3563b4" />
    </linearGradient>
    <radialGradient id="lift" cx=".28" cy=".18" r=".72">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".55" />
      <stop offset=".55" stop-color="#ffffff" stop-opacity=".08" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="petal" x1=".35" y1="0" x2=".65" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset=".62" stop-color="#f6fbff" />
      <stop offset="1" stop-color="#dbe9f8" />
    </linearGradient>
    <linearGradient id="petalAlt" x1=".3" y1="0" x2=".7" y2="1">
      <stop offset="0" stop-color="#f2f8ff" />
      <stop offset="1" stop-color="#cfe2f6" />
    </linearGradient>
    <radialGradient id="bloom" cx=".5" cy=".5" r=".5">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".26" />
      <stop offset=".62" stop-color="#ffffff" stop-opacity=".1" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="gold" x1=".25" y1="0" x2=".75" y2="1">
      <stop offset="0" stop-color="#ffe49b" />
      <stop offset=".5" stop-color="#f2bf58" />
      <stop offset="1" stop-color="#d0922a" />
    </linearGradient>
    <linearGradient id="glassHi" x1="0" y1="0" x2=".3" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".3" />
      <stop offset=".5" stop-color="#fff" stop-opacity=".05" />
      <stop offset="1" stop-color="#fff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="glassShade" x1="0" y1=".5" x2="0" y2="1">
      <stop offset="0" stop-color="#0b2a52" stop-opacity="0" />
      <stop offset="1" stop-color="#0b2a52" stop-opacity=".26" />
    </linearGradient>
    <clipPath id="tile">
      <rect width="512" height="512" rx="116" />
    </clipPath>
  </defs>

  <g clip-path="url(#tile)">
    <!-- 底板 -->
    <rect width="512" height="512" fill="url(#sky)" />
    <rect width="512" height="512" fill="url(#lift)" />

    <!-- 气泡纹（原图背景元素） -->
    <g>
      <circle cx="92" cy="104" r="34" fill="#ffffff" fill-opacity=".13" stroke="#ffffff" stroke-opacity=".38" stroke-width="3" />
      <circle cx="80" cy="92" r="9" fill="#ffffff" fill-opacity=".5" />
      <circle cx="424" cy="148" r="22" fill="#ffffff" fill-opacity=".1" stroke="#ffffff" stroke-opacity=".32" stroke-width="3" />
      <circle cx="408" cy="392" r="42" fill="#ffffff" fill-opacity=".09" stroke="#ffffff" stroke-opacity=".26" stroke-width="3" />
      <circle cx="118" cy="416" r="16" fill="#ffffff" fill-opacity=".12" stroke="#ffffff" stroke-opacity=".3" stroke-width="2.5" />
    </g>

    <!-- 花心柔光：把花瓣从底板上"托"起来 -->
    <circle cx="256" cy="256" r="188" fill="url(#bloom)" />

    <!-- 五瓣花：单片花瓣 -90° 起，每 72° 一片；两片偏冷、三片纯白，做出层次 -->
    <g stroke="#ffffff" stroke-opacity=".85" stroke-width="1.6">
      <path d="M256 250C224 218 212 178 222 146c6-18 20-28 34-28s28 10 34 28c10 32-2 72-34 104z" transform="rotate(144 256 250)" fill="url(#petalAlt)" />
      <path d="M256 250C224 218 212 178 222 146c6-18 20-28 34-28s28 10 34 28c10 32-2 72-34 104z" transform="rotate(216 256 250)" fill="url(#petalAlt)" />
      <path d="M256 250C224 218 212 178 222 146c6-18 20-28 34-28s28 10 34 28c10 32-2 72-34 104z" transform="rotate(0 256 250)" fill="url(#petal)" />
      <path d="M256 250C224 218 212 178 222 146c6-18 20-28 34-28s28 10 34 28c10 32-2 72-34 104z" transform="rotate(72 256 250)" fill="url(#petal)" />
      <path d="M256 250C224 218 212 178 222 146c6-18 20-28 34-28s28 10 34 28c10 32-2 72-34 104z" transform="rotate(288 256 250)" fill="url(#petal)" />
    </g>
    <!-- 花瓣内层高光（两片朝上的花瓣各一道） -->
    <g fill="#ffffff" opacity=".85">
      <ellipse cx="240" cy="172" rx="9" ry="26" transform="rotate(-41 240 172)" />
      <ellipse cx="272" cy="172" rx="9" ry="26" transform="rotate(41 272 172)" />
    </g>

    <!-- 花心金星（胸针）：外接半径 74 -->
    <path
      d="M256 176l18.6 38.6 42.2 5.9-30.6 29.6 7.4 41.8-37.6-20.2-37.6 20.2 7.4-41.8-30.6-29.6 42.2-5.9z"
      fill="url(#gold)"
    />
    <ellipse cx="236" cy="228" rx="11" ry="7" transform="rotate(-42 236 228)" fill="#fff8e2" fill-opacity=".85" />

    <!-- 玻璃覆盖层 -->
    <rect width="512" height="512" fill="url(#glassHi)" />
    <rect width="512" height="512" fill="url(#glassShade)" />
    <rect x="5" y="5" width="502" height="502" rx="112" fill="none" stroke="#fff" stroke-opacity=".34" stroke-width="4" />
  </g>
</svg>
